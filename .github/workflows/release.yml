name: Release installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Verify tag and package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

  desktop:
    name: ${{ matrix.label }} installer
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          - label: Windows x64
            os: windows-latest
            args: --bundles nsis,msi
            rust-targets: ""
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build and publish desktop installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          generateReleaseNotes: true
          releaseName: Swell Note ${{ github.ref_name }}
          tagName: ${{ github.ref_name }}
      - name: Build desktop installer for verification
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
        with:
          args: ${{ matrix.args }}
      - name: Upload desktop workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: swell-note-${{ matrix.os }}
          path: ${{ matrix.artifact-path }}

  android:
    name: Android package
    needs: [verify, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Require Android signing secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_BASE64" && test -n "$ANDROID_KEY_PASSWORD"
      - name: Configure Android signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/swell-note-upload.jks"
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$RUNNER_TEMP/swell-note-upload.jks" > src-tauri/gen/android/keystore.properties
      - name: Build signed Android APK and AAB
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm tauri android build --target aarch64 --apk --aab --ci
      - name: Build installable Android debug APK
        if: github.event_name == 'workflow_dispatch'
        run: pnpm build:android:debug
      - name: Upload Android workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: swell-note-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
      - name: Upload Android packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  ios:
    name: iOS package
    needs: [verify, desktop]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Require iOS signing secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: test -n "$IOS_CERTIFICATE" && test -n "$IOS_CERTIFICATE_PASSWORD" && test -n "$IOS_MOBILE_PROVISION"
      - name: Build signed iOS IPA
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: pnpm tauri ios build --export-method app-store-connect --ci
      - name: Build iOS simulator app
        if: github.event_name == 'workflow_dispatch'
        run: pnpm build:ios:sim
      - name: Upload iOS workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: swell-note-ios-simulator
          path: src-tauri/gen/apple/build/**/*.app
      - name: Upload iOS IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: src-tauri/gen/apple/build/**/*.ipa
